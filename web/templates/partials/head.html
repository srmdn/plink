{{define "head"}}
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>plink</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
<script src="/js/htmx.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0f0f0f;
    --surface: #1a1a1a;
    --surface2:#222222;
    --border:  #2a2a2a;
    --text:    #e5e5e5;
    --muted:   #737373;
    --accent:  #22c55e;
    --danger:  #ef4444;
    --radius:  6px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', monospace;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100dvh;
  }

  #app { display: flex; flex-direction: column; min-height: 100dvh; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: -0.03em; }
  .logo span { color: var(--muted); font-weight: 400; }

  main { flex: 1; padding: 20px; max-width: 1120px; width: 100%; margin: 0 auto; }

  /* ── Login ── */
  #login-view {
    display: flex; align-items: center; justify-content: center;
    min-height: 80dvh; padding: 20px;
  }
  .login-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 24px; width: min(340px, 100%);
  }
  .login-box h2 { font-size: 14px; margin-bottom: 20px; }
  .login-error { color: var(--danger); font-size: 12px; margin-bottom: 12px; }

  /* ── Forms ── */
  label {
    display: block; font-size: 10px; color: var(--muted);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  input[type="text"], input[type="password"], input[type="url"], input[type="number"] {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-family: inherit;
    font-size: 13px; padding: 9px 11px; outline: none;
    transition: border-color 0.15s; -webkit-appearance: none;
  }
  input:focus { border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .field-help { color: var(--muted); font-size: 10px; margin-top: 4px; }
  .form-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .check-row { display: flex; align-items: center; gap: 8px; color: var(--text); cursor: pointer; padding-top: 24px; text-transform: none; letter-spacing: 0; font-size: 12px; }
  .check-row input { accent-color: var(--accent); width: 15px; height: 15px; }

  /* ── Buttons ── */
  button, .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 5px; border: 1px solid transparent; border-radius: var(--radius);
    cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500;
    padding: 7px 14px; transition: opacity 0.15s, border-color 0.15s, color 0.15s;
    text-decoration: none; white-space: nowrap; -webkit-tap-highlight-color: transparent;
    background: transparent;
  }
  button:active, .btn:active { opacity: 0.65; }
  .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn-ghost   { background: transparent; border-color: var(--border); color: var(--muted); }
  .btn-ghost:hover { color: var(--text); border-color: #444; }
  .btn-danger  { background: transparent; border-color: transparent; color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-full { width: 100%; }
  .btn-copy.copied { color: var(--accent) !important; border-color: var(--accent) !important; }

  /* ── Toolbar ── */
  .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; margin-bottom: 16px; }
  .toolbar-left { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  #search {
    flex: 1; min-width: 140px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-family: inherit;
    font-size: 12px; padding: 7px 11px; outline: none; transition: border-color 0.15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }
  .cat-filter {
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 7px 10px; font-family: inherit;
    font-size: 12px; cursor: pointer; outline: none; max-width: 160px;
  }
  .date-filter {
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 7px 10px; font-family: inherit;
    font-size: 12px; cursor: pointer; outline: none; min-width: 142px; color-scheme: dark;
  }
  .date-filter:focus { border-color: var(--accent); }
  .count { color: var(--muted); font-size: 11px; white-space: nowrap; }

  .dashboard-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
  .dashboard-stats .stat-card { min-width: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  /* ── Link table ── */
  .links-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .status-summary { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .status-summary strong { color: var(--text); font-weight: 500; }
  .cat-filter { min-width: 142px; }
  .clear-filters { color: var(--accent); font-size: 11px; text-decoration: none; }
  .clear-filters:hover { text-decoration: underline; }
  .table-wrap { overflow-x: auto; padding-bottom: 2px; }
  .link-table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0 8px; }
  .link-table th { text-align: left; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 0 12px 6px; }
  .link-table th:nth-child(1) { width: 31%; }
  .link-table th:nth-child(2) { width: 29%; }
  .link-table th:nth-child(3) { width: 8%; }
  .link-table th:nth-child(4) { width: 10%; }
  .link-table th:nth-child(5) { width: 22%; }
  .link-table.status-hidden th:nth-child(1) { width: 32%; }
  .link-table.status-hidden th:nth-child(2) { width: 31%; }
  .link-table.status-hidden th:nth-child(3) { width: 9%; }
  .link-table.status-hidden th:nth-child(4) { width: 28%; }
  .link-table td { overflow: hidden; background: var(--surface); padding: 13px 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); vertical-align: top; }
  .link-table td:first-child { border-left: 1px solid var(--border); border-radius: var(--radius) 0 0 var(--radius); }
  .link-table td:last-child { border-right: 1px solid var(--border); border-radius: 0 var(--radius) var(--radius) 0; overflow: visible; }
  .link-main, .link-copy { min-width: 0; }
  .slug-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .featured-badge { color: var(--accent); border-color: rgba(34, 197, 94, .35); }
  .priority-badge { color: var(--accent); font-size: 10px; }
  .link-destination { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; text-decoration: none; }
  .link-destination:hover { color: var(--text); text-decoration: underline; }
  .clicks-cell { white-space: nowrap; color: var(--text); }
  .status-cell { white-space: nowrap; }
  .status { font-size: 11px; }
  .status.on { color: var(--accent); }
  .status.off { color: var(--muted); }
  .row-actions { display: flex; gap: 5px; justify-content: flex-end; align-items: center; flex-wrap: nowrap; }
  .row-menu { position: relative; }
  .row-menu summary { list-style: none; }
  .row-menu summary::-webkit-details-marker { display: none; }
  .row-menu-panel { position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; min-width: 128px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 12px 28px rgba(0,0,0,.35); }
  .row-menu-item { display: flex; width: 100%; justify-content: flex-start; border: 0; color: var(--muted); padding: 7px 9px; }
  .row-menu-item:hover { background: var(--surface2); color: var(--text); }
  .row-menu-danger { color: var(--danger); }
  .empty-state { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 13px; }

  /* Export dropdown */
  .export-wrap { position: relative; }
  .export-menu {
    position: absolute; top: calc(100% + 4px); right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; min-width: 190px; z-index: 20;
  }
  .export-menu a {
    display: block; padding: 9px 14px; color: var(--muted); font-size: 12px;
    text-decoration: none; cursor: pointer;
  }
  .export-menu a:hover { background: var(--surface2); color: var(--text); }

  /* ── Cards ── */
  .links-list { display: flex; flex-direction: column; gap: 8px; }

  .link-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    display: flex; flex-direction: column; gap: 6px;
    transition: border-color 0.15s, opacity 0.2s;
  }
  .link-card:hover { border-color: #3a3a3a; }
  .link-card.inactive { opacity: 0.45; }
  .link-card.inactive:hover { opacity: 0.7; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-slug-row { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; min-width: 0; }
  .slug { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .link-card.inactive .slug { color: var(--muted); text-decoration: line-through; }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
  }
  .status-dot.active   { background: var(--accent); }
  .status-dot.inactive { background: var(--muted); }

  .cat-badge {
    display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 99px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .card-clicks { color: var(--muted); font-size: 11px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }

  .card-url {
    color: var(--muted); font-size: 11px; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block;
  }
  .card-url:hover { color: var(--text); }
  .card-desc { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .card-actions {
    display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
    margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  .card-actions .spacer { flex: 1; }

  .empty-state { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 13px; }

  /* ── Modal ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); width: 100%; max-width: 480px;
    max-height: 90dvh; overflow-y: auto; padding: 22px;
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-title { font-size: 14px; font-weight: 600; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .modal-error { color: var(--danger); font-size: 12px; margin-bottom: 12px; }

  @media (max-width: 520px) {
    .overlay { padding: 0; align-items: flex-end; }
    .modal { border-radius: 12px 12px 0 0; max-height: 88dvh; border-bottom: none; }
    .modal-footer { flex-direction: column-reverse; gap: 8px; }
    .modal-footer button { width: 100%; }
    .form-pair { grid-template-columns: 1fr; gap: 0; }
    .check-row { padding-top: 0; margin-bottom: 14px; }
  }

  @media (max-width: 700px) {
    header { padding-left: 16px; padding-right: 16px; }
    main { padding: 18px 16px 28px; }
    .dashboard-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 20px; }
    .dashboard-stats .stat-card:last-child { grid-column: 1 / -1; }
    .toolbar { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; }
    .toolbar-left { grid-column: 1 / -1; }
    .toolbar > .btn, .toolbar .export-wrap, .toolbar .export-wrap > .btn { width: 100%; }
    .links-controls { align-items: flex-start; }
    .filter-group { width: 100%; }
    .filter-group .cat-filter, .filter-group .date-filter { flex: 1; min-width: 0; max-width: none; }
    .link-table thead, .link-table td.destination { display: none; }
    .link-table, .link-table tbody { display: block; width: 100%; }
    .link-table tr { display: grid; grid-template-columns: 1fr auto; width: 100%; margin-bottom: 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); position: relative; }
    .link-table td { display: block; width: auto; overflow: visible; background: transparent; border: 0 !important; border-radius: 0 !important; padding: 12px; }
    .link-table td:first-child { grid-column: 1 / -1; border-bottom: 1px solid var(--border) !important; }
    .link-table td:nth-child(3) { grid-column: 1; border-bottom: 1px solid var(--border) !important; }
    .link-table td:nth-child(4) { grid-column: 2; border-bottom: 1px solid var(--border) !important; text-align: right; }
    .link-table td:last-child { grid-column: 1 / -1; border-top: 0 !important; }
    .row-actions { justify-content: flex-start; flex-wrap: wrap; }
    .row-menu-panel { right: auto; left: 0; }
    .status-summary { margin-left: 0; }
  }

  /* ── Analytics ── */
  .analytics-modal { max-width: 560px; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .analytics-modal > .modal-header { flex-shrink: 0; margin-bottom: 18px; padding: 22px 22px 0; background: var(--surface); }
  .analytics-modal > #analytics-body { min-height: 0; overflow-y: auto; padding: 0 22px 22px; }
  .analytics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .analytics-grid-compact { grid-template-columns: repeat(2, 1fr); }
  .analytics-linkbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .analytics-url-wrap { min-width: 0; flex: 1; }
  .analytics-url { display: block; color: var(--text); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
  .analytics-url:hover { color: var(--accent); }
  .analytics-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .link-analytics-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .link-analytics-grid .stat-card { min-width: 0; min-height: 76px; }
  .stat-value-text { min-width: 0; font-size: clamp(12px, 2.8vw, 16px); line-height: 1.2; white-space: normal; overflow: visible; overflow-wrap: anywhere; }
  @media (max-width: 420px) { .analytics-grid { grid-template-columns: 1fr 1fr; } }

  .stat-card { min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .stat-value { min-width: 0; font-size: clamp(16px, 3.8vw, 20px); line-height: 1.15; font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  .chart-wrap { margin-bottom: 20px; }
  .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .section-label { font-size: 10px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
  .section-meta { color: var(--muted); font-size: 10px; white-space: nowrap; }
  .chart-svg { width: 100%; display: block; overflow: visible; }
  .chart-day { cursor: pointer; outline: none; }
  .chart-day:focus .chart-hit, .chart-day:hover .chart-hit { fill: var(--accent); opacity: .12; stroke: var(--accent); stroke-width: 1; }
  .chart-hit { pointer-events: all; }
  .chart-empty { min-height: 72px; display: flex; align-items: center; justify-content: center; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); font-size: 11px; }

  .referrer-group { border-bottom: 1px solid var(--border); }
  .referrer-group:last-child { border-bottom: none; }
  .referrer-group > summary { list-style: none; cursor: pointer; }
  .referrer-group > summary::-webkit-details-marker { display: none; }
  .ref-row { display: flex; align-items: center; padding: 7px 0; gap: 10px; }
  .ref-source { color: var(--text); font-size: 12px; flex: 0 1 40%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ref-bar-wrap { flex: 1; height: 4px; background: var(--border); border-radius: 2px; flex-shrink: 0; min-width: 40px; }
  .ref-bar { display: block; height: 100%; background: var(--accent); border-radius: 2px; opacity: 0.6; }
  .ref-count { color: var(--muted); font-size: 11px; min-width: 28px; text-align: right; flex-shrink: 0; }
  .ref-percent { color: var(--muted); font-size: 10px; min-width: 34px; text-align: right; flex-shrink: 0; }
  .ref-links { color: var(--muted); font-size: 10px; white-space: nowrap; flex-shrink: 0; }
  .ref-expand { color: var(--muted); font-size: 12px; min-width: 10px; text-align: right; flex-shrink: 0; }
  .referrer-group[open] .ref-expand { color: var(--accent); }
  .referrer-details { max-height: 220px; overflow-y: auto; margin: 0 0 8px 12px; padding: 6px 0 4px 12px; border-left: 1px solid var(--border); }
  .ref-details-label { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .ref-detail-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 4px 0; color: var(--muted); font-size: 11px; }
  .ref-detail-row span:first-child { min-width: 0; overflow-wrap: anywhere; word-break: break-word; }

  @media (max-width: 520px) {
    .analytics-linkbar { align-items: stretch; flex-direction: column; }
    .analytics-actions { justify-content: flex-start; }
  }

  .htmx-indicator { opacity: 0; transition: opacity 0.2s; }
  .htmx-request .htmx-indicator { opacity: 1; }
  .hidden { display: none !important; }
</style>
{{if .Production}}<script defer src="https://analytics.srmdn.com/script.js" data-website-id="3c25cb51-83c4-4302-9f91-fa8319fe593e"></script>{{end}}
<script>
function openModal() {
  document.getElementById('link-modal').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('link-modal').classList.add('hidden');
}
function openAnalyticsModal() {
  document.getElementById('analytics-modal').classList.remove('hidden');
}
function closeAnalyticsModal() {
  document.getElementById('analytics-modal').classList.add('hidden');
}
function refreshOpenAnalytics() {
  var modal = document.getElementById('analytics-modal');
  var content = document.getElementById('analytics-refresh');
  var date = document.getElementById('date-filter');
  if (!modal || modal.classList.contains('hidden') || !content || !content.dataset.analyticsUrl) return;
  var url = content.dataset.analyticsUrl;
  if (date && date.value) url += '?date=' + encodeURIComponent(date.value);
  htmx.ajax('GET', url, {target: '#analytics-body', swap: 'innerHTML'});
}
function selectReportDate(value) {
  var date = document.getElementById('date-filter');
  if (!date || !value) return;
  date.value = value;
  date.dispatchEvent(new Event('change', {bubbles: true}));
}
function publicBaseURL() {
  var configured = document.body && document.body.dataset ? document.body.dataset.publicUrl : '';
  return (configured || location.origin).replace(/\/+$/, '');
}
function linkURL(slug) {
  return new URL('/' + encodeURIComponent(slug), publicBaseURL()).href;
}
function copyTextFallback(text) {
  return new Promise(function(resolve, reject) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    var copied = false;
    try { copied = document.execCommand('copy'); } catch (e) { copied = false; }
    textarea.remove();
    if (copied) resolve(); else reject(new Error('clipboard unavailable'));
  });
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    var clipboardWrite = navigator.clipboard.writeText(text);
    var clipboardTimeout = new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error('clipboard timeout')); }, 800);
    });
    return Promise.race([clipboardWrite, clipboardTimeout]).catch(function() {
      return copyTextFallback(text);
    });
  }
  return copyTextFallback(text);
}
function feedbackButton(btn, text) {
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = text;
  btn.classList.add('copied');
  clearTimeout(btn._feedbackTimer);
  btn._feedbackTimer = setTimeout(function() {
    btn.textContent = btn.dataset.label;
    btn.classList.remove('copied');
  }, 1500);
}
function copyLink(btn) {
  var slug = btn.dataset.slug;
  if (!slug) return;
  feedbackButton(btn, 'copying…');
  copyText(linkURL(slug)).then(function() {
    feedbackButton(btn, 'copied!');
  }).catch(function() {
    feedbackButton(btn, 'copy failed');
  });
}
function copyURL(btn) {
  var url = btn.dataset.url;
  if (!url) return;
  feedbackButton(btn, 'copying…');
  copyText(url).then(function() {
    feedbackButton(btn, 'copied!');
  }).catch(function() {
    feedbackButton(btn, 'copy failed');
  });
}
function shareURL(btn) {
  var url = btn.dataset.url;
  if (!url) return;
  feedbackButton(btn, 'sharing…');
  if (navigator.share) {
    navigator.share({title: url, url: url}).then(function() {
      feedbackButton(btn, 'shared!');
    }).catch(function(error) {
      if (error && error.name === 'AbortError') return;
      copyText(url).then(function() {
        feedbackButton(btn, 'copied!');
      }).catch(function() {
        feedbackButton(btn, 'share failed');
      });
    });
    return;
  }
  copyText(url).then(function() {
    feedbackButton(btn, 'copied!');
  }).catch(function() {
    feedbackButton(btn, 'share failed');
  });
}
function toggleExportMenu(e) {
  e.stopPropagation();
  document.getElementById('export-menu').classList.toggle('hidden');
}
document.addEventListener('click', () => {
  const m = document.getElementById('export-menu');
  if (m) m.classList.add('hidden');
});
// Open modals when htmx swaps content into them
document.addEventListener('htmx:afterSwap', function(e) {
  if (e.detail.target.id === 'modal-body') openModal();
  if (e.detail.target.id === 'analytics-body') openAnalyticsModal();
});
// Close modal after successful form save (triggered by HX-Trigger: closeModal)
document.addEventListener('closeModal', closeModal);
// CSRF: include token in all htmx requests
function getCsrfToken() {
  var m = document.cookie.match(/(?:^|;\s*)plink_csrf=([^;]*)/);
  return m ? m[1] : '';
}
document.addEventListener('htmx:configRequest', function(e) {
  var token = getCsrfToken();
  if (token) e.detail.headers['X-CSRF-Token'] = token;
});
// CSRF: inject hidden input into traditional forms (e.g. logout)
document.addEventListener('DOMContentLoaded', function() {
  var token = getCsrfToken();
  if (!token) return;
  document.querySelectorAll('form').forEach(function(f) {
    var input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'csrf_token';
    input.value = token;
    f.appendChild(input);
  });
});
</script>
